version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cloudvault:latest
    container_name: cloudvault_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "${APP_NAME:-CloudVault}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      
      # External Centralized MySQL Database (Proxmox LXC Container at 192.168.10.20)
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-192.168.10.20}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-cloud_drive}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      
      BROADCAST_CONNECTION: log
      CACHE_STORE: file
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
    volumes:
      # Persistent local disk attached to LXC container
      - cloudvault-storage:/var/www/html/storage/app/uploads
      - cloudvault-logs:/var/www/html/storage/logs

volumes:
  cloudvault-storage:
    driver: local
  cloudvault-logs:
    driver: local
